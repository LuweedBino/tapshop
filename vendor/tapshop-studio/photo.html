<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TapShop Photo Lab</title>
<script>/* Inside the dashboard, follow its light/dark cookie before first paint so nothing flashes. */(()=>{let r=document.documentElement,emb=false;try{emb=parent!==window&&parent.location.origin===location.origin}catch{}let t=emb?((/(?:^|;\s*)tapshop_theme=(dark|light)/.exec(document.cookie)||[])[1]||'light'):(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=t})()</script>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f4f5;--panel:#fff;--line:#e4e4e7;--text:#18181b;--muted:#71717a;--hi:#18181b;--hiText:#fff;--soft:#f4f4f5;--stage:#e4e4e7;--accent:#ff3ea5}
[data-theme=dark]{--bg:#09090b;--panel:#18181b;--line:#2e2e33;--text:#f4f4f5;--muted:#a1a1aa;--hi:#f4f4f5;--hiText:#09090b;--soft:#27272a;--stage:#0f0f12}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;white-space:nowrap}
button:hover{background:var(--soft)}button.primary{background:var(--hi);color:var(--hiText);border-color:var(--hi)}
button:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 7px;min-width:0}
input[type=range]{accent-color:var(--hi);width:100%}input[type=checkbox]{accent-color:var(--hi)}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;height:100dvh}
.top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:800;letter-spacing:-.3px;white-space:nowrap}.brand em{font-style:normal;color:var(--accent)}
#docName{width:150px;border:0;background:transparent;font-weight:600}
.menubar{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;min-width:0}.menubar::-webkit-scrollbar{display:none}
.menubar>button{border:0;background:transparent;padding:7px 9px}.menubar>button[aria-expanded=true]{background:var(--soft)}
.spacer{flex:1}
.menu{position:fixed;z-index:60;min-width:220px;max-height:calc(100dvh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px #0003;padding:5px}
.menu button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;gap:16px}.menu button:hover:not(:disabled){background:var(--soft)}
.menu kbd{margin-left:auto;font:11px system-ui;color:var(--muted)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}.menu h6{margin:6px 10px 2px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.main{display:grid;grid-template-columns:auto 1fr 270px;min-height:0}
#toolbox{background:var(--panel);border-right:1px solid var(--line);padding:6px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.toolgrid{display:grid;grid-template-columns:repeat(2,38px);gap:3px}
.toolgrid button{width:38px;height:38px;padding:0;font-size:17px;line-height:1;border-color:transparent;background:transparent;display:grid;place-items:center}
.toolgrid button.on{background:var(--hi);color:var(--hiText)}
.swatches{position:relative;width:62px;height:56px;margin-top:4px;flex:none}
.swatches .sw{position:absolute;width:34px;height:34px;border-radius:7px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
#fgSw{left:0;top:0;z-index:2}#bgSw{left:20px;top:18px}
.swatches .mini{position:absolute;border:0;background:transparent;padding:0;font-size:13px;width:18px;height:18px}
#swapC{right:-2px;top:-2px}#resetC{left:-2px;bottom:-4px;font-size:10px}
#stage{position:relative;overflow:hidden;background:var(--stage);touch-action:none;min-width:0;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#dock{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 4px;font-weight:600;color:var(--muted)}.tabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--hi)}
.pane{overflow:auto;padding:10px;min-height:0}.pane[hidden]{display:none}
.opt{display:block;margin:0 0 10px}.opt>span{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}.opt select,.opt input[type=text],.opt textarea{width:100%}
.opt.check{display:flex;align-items:center;gap:8px;font-size:12px}.opt.check>span{display:inline;margin:0;color:var(--text);font-size:12px}
.optbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.optbtns button{flex:1}
.toolhead{font-weight:700;margin:0 0 8px;font-size:14px}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0 10px}
.layers{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:6px;padding:4px;border-radius:8px;border:1px solid transparent;cursor:pointer}.lrow.on{border-color:var(--hi);background:var(--soft)}
.lrow canvas{width:40px;height:40px;border-radius:5px;flex:none;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow button{border:0;background:transparent;padding:3px 4px;font-size:14px}.lrow .off{opacity:.3}
.lctl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}.lctl button{padding:6px 2px;font-size:12px}
.hist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px}.hist button.on{background:var(--hi);color:var(--hiText)}.hist button.future{opacity:.4}
.status{display:flex;gap:12px;align-items:center;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status button{padding:2px 7px;font-size:11px}
#start{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:28px 16px}
#start[hidden]{display:none}.startbox{width:min(720px,100%)}
.startbox h1{font-size:30px;letter-spacing:-1px;margin:6px 0 4px}.startbox h1 em{font-style:normal;color:var(--accent)}.startbox>p{color:var(--muted);margin:0 0 20px}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.bigbtns button{padding:18px 12px;border-radius:14px;text-align:left;white-space:normal}.bigbtns b{display:block;font-size:22px;margin-bottom:6px}.bigbtns small{display:block;color:var(--muted);margin-top:2px}
.bigbtns button.primary small{color:inherit;opacity:.75}
.startbox h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}.sizes button{text-align:left;padding:10px 12px;white-space:normal}.sizes small{display:block;color:var(--muted)}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.custom input[type=number]{width:90px}
#resume{margin-bottom:24px}#resume[hidden]{display:none}
.pl-dlg{position:fixed;z-index:50;right:12px;bottom:40px;left:auto;top:auto;margin:0;width:min(340px,calc(100vw - 24px));max-height:min(78dvh,640px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);box-shadow:0 18px 50px #0004;padding:14px}
.pl-dlg h3{margin:0 0 10px;font-size:15px}.pl-dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pl-dlg.center{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%)}
.pl-dlg::backdrop{background:#0006}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:70;background:#18181b;color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 8px 24px #0005;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
.busy{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#0004;color:#fff;font-weight:700;font-size:15px}.busy[hidden]{display:none}
#dockToggle,#toolsToggle{display:none}
@media (max-width:820px){
 .top{flex-wrap:wrap;row-gap:2px}.menubar{order:5;width:100%}#docName{width:60px;flex:1}.top>button{padding:7px 10px}
 .top .wide{display:none}
 .main{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
 #stage{grid-row:1}
 #toolbox{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:4px 6px;align-items:center}
 .toolgrid{grid-template-columns:none;grid-auto-flow:column;grid-template-rows:38px}
 .swatches{width:58px;height:44px;margin:0 4px}.swatches .sw{width:28px;height:28px}#bgSw{left:18px;top:14px}
 #dock{grid-row:3;border-left:0;border-top:1px solid var(--line);grid-template-rows:auto auto;max-height:42dvh}
 #dock.closed .pane{display:none}
 #dock .pane{max-height:calc(42dvh - 42px)}
 #dockToggle{display:block;border:0;border-radius:0;background:transparent;padding:10px 12px;font-size:14px}
 .status .wide{display:none}
}
@media (max-width:480px){#docName{display:none}.top .spacer{flex:1}}
</style></head>
<body>
<div class="app">
 <header class="top">
  <button id="backBtn" title="Back to Studio">← <span class="wide">Studio</span></button>
  <div class="brand"><span class="wide">TapShop </span><em>Photo Lab</em></div>
  <input id="docName" aria-label="Image name" value="Untitled image">
  <nav class="menubar" id="menubar" aria-label="Menus"></nav>
  <span class="spacer"></span>
  <button id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
  <button id="vaultBtn" class="wide" title="Save a PNG to your Media Vault">Save to Vault</button>
  <button id="sellBtn" class="wide" title="Put this picture on your store">Sell this</button>
  <button id="exportBtn" class="primary">Export ↓</button>
 </header>
 <div class="main">
  <nav id="toolbox" aria-label="Tools"><div class="toolgrid" id="toolgrid"></div>
   <div class="swatches"><button class="sw" id="fgSw" title="Foreground colour" aria-label="Foreground colour"></button><button class="sw" id="bgSw" title="Background colour" aria-label="Background colour"></button><button class="mini" id="swapC" title="Swap colours (X)" aria-label="Swap colours">⇄</button><button class="mini" id="resetC" title="Black and white (D)" aria-label="Reset colours">◩</button>
    <input type="color" id="fgIn" hidden><input type="color" id="bgIn" hidden></div>
  </nav>
  <div id="stage"><canvas id="view"></canvas></div>
  <aside id="dock" class="closed">
   <div class="tabs"><button data-tab="opts" class="on">Tool options</button><button data-tab="layers">Layers</button><button data-tab="hist">History</button><button id="dockToggle" aria-label="Show or hide panel">▴</button></div>
   <div class="pane" id="pane-opts"></div>
   <div class="pane" id="pane-layers" hidden></div>
   <div class="pane hist" id="pane-hist" hidden></div>
  </aside>
 </div>
 <footer class="status"><span id="stZoom">100%</span><button id="fitBtn">Fit</button><button id="oneBtn" class="wide">100%</button><span id="stSize"></span><span id="stPos" class="wide"></span><span id="stHint"></span></footer>
</div>
<div id="start" hidden><div class="startbox">
 <h1>Photo <em>Lab</em></h1><p>Edit photos with layers, selections, retouching brushes, colour tools and filters.</p>
 <div id="resume" hidden><button class="primary" id="resumeBtn" style="width:100%;padding:14px;border-radius:14px;text-align:left"><b>↻ Continue where you left off</b> <small id="resumeName" style="opacity:.75"></small></button></div>
 <div class="bigbtns">
  <button class="primary" id="openDevice"><b>🖼</b>Open a photo<small>From this device</small></button>
  <button id="openVault"><b>⛁</b>From Media Vault<small>Your saved files</small></button>
  <button id="openCamera"><b>📷</b>Take a photo<small>Use your camera</small></button>
 </div>
 <h2>Or start blank</h2>
 <div class="sizes" id="sizes"></div>
 <div class="custom"><input type="number" id="cw" value="1080" min="1" max="8000" aria-label="Width"> × <input type="number" id="ch" value="1080" min="1" max="8000" aria-label="Height"> px
  <select id="cfill" aria-label="Fill"><option value="white">White</option><option value="transparent">Transparent</option><option value="black">Black</option><option value="fg">Foreground colour</option></select>
  <button id="customBtn">Create</button></div>
 <button id="startClose" hidden>Back to my image</button>
</div></div>
<dialog id="dlg" class="pl-dlg"></dialog>
<div id="toast" class="toast" role="status"></div>
<div id="busy" class="busy" hidden>Working…</div>
<input type="file" id="fileIn" accept="image/*" hidden><input type="file" id="layerIn" accept="image/*" multiple hidden><input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<link rel="stylesheet" href="text-fonts.css"><script src="text-catalog.js"></script>
<script src="color-picker.js"></script>
<script src="vault-picker.js"></script>
<script src="photo-core.js"></script>
<script src="photo-adjust.js"></script>
<script src="photo-tools.js"></script>
<script src="photo-io.js"></script>
<script src="tapshop-theme.js"></script>
</body></html>
